name: Nagrania głosu

on:
  push:
    branches: [main]
    paths: ['glos/frazy.txt', '.github/workflows/glos.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nagraj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Piper i ffmpeg
        run: |
          pip install piper-tts
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          mkdir -p modele
          curl -sSL -o modele/gosia.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx
          curl -sSL -o modele/gosia.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/main/pl/pl_PL/gosia/medium/pl_PL-gosia-medium.onnx.json
      - name: Nagraj frazy (warianty barwy)
        run: |
          # nazwa_wariantu:współczynnik wysokości (mniej = niższy głos, tempo bez zmian)
          for wariant in gosia:1.0 gosia_nizsza:0.93 gosia_niska:0.87 gosia_najnizsza:0.82; do
            nazwa=${wariant%%:*}; f=${wariant##*:}
            mkdir -p "glos/$nazwa"
            while IFS='|' read -r klucz tekst; do
              [ -z "$klucz" ] && continue
              echo "$tekst" | piper --model modele/gosia.onnx --length_scale 1.12 --sentence_silence 0.15 --output_file "/tmp/$klucz.wav"
              sr=$(ffprobe -v error -select_streams a:0 -show_entries stream=sample_rate -of csv=p=0 "/tmp/$klucz.wav")
              if [ "$f" = "1.0" ]; then filtr="anull"; else
                filtr="asetrate=$(python3 -c "print(int($sr*$f))"),aresample=$sr,atempo=$(python3 -c "print(round(1/$f,4))"),bass=g=2:f=180"; fi
              ffmpeg -y -loglevel error -i "/tmp/$klucz.wav" -af "$filtr,afade=t=in:d=0.02,loudnorm=I=-16:TP=-1.5" -ac 1 -ar 24000 -b:a 64k "glos/$nazwa/$klucz.mp3"
            done < glos/frazy.txt
          done
          ls -laR glos | head -60
      - name: Zapisz w repozytorium
        run: |
          git config user.name "magdalenap-kramm"
          git config user.email "magdalena.p@kramm.pl"
          git add glos
          git diff --cached --quiet || git commit -m "Nagrania głosu (Piper, gosia, warianty)"
          git pull --rebase
          git push
